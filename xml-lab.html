<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XML Lab - Book Catalogue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #333; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>📚 图书目录 (Book Catalogue)</h1>
    <table id="bookTable">
        <thead>
            <tr><th>ID</th><th>Title</th><th>Author</th><th>Price</th></tr>
        </thead>
        <tbody id="bookBody"></tbody>
    </table>
    <script src="xml-script.js"></script>
</body>
</html>
